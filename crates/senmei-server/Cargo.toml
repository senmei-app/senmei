[package]
name = "senmei-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Senmei service (MCP stdio first; HTTP behind a feature)."

[dependencies]
senmei-media = { path = "../senmei-media", version = "0.1.2" }
senmei-ml = { path = "../senmei-ml", version = "0.1.2" }
senmei-pipeline = { path = "../senmei-pipeline", version = "0.1.2", optional = true }

rmcp = { version = "3", features = ["server", "transport-io"] }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[features]
default = []
# Real render: pulls the burn inference stack + pipeline (heavy build).
render = ["dep:senmei-pipeline", "senmei-ml/burn"]
# Full web UI + REST API (axum).
http = ["dep:axum", "dep:tower-http"]
