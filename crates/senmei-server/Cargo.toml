[package]
name = "senmei-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Senmei service (MCP stdio first; HTTP behind a feature)."

[dependencies]
senmei-core = { path = "../senmei-core", version = "0.1.4" }
senmei-media = { path = "../senmei-media", version = "0.1.2" }
senmei-ml = { path = "../senmei-ml", version = "0.1.2" }

rmcp = { version = "3", features = ["server", "transport-io"] }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

[dev-dependencies]
# Router smoke tests (oneshot + body collect); no GPU / no network (system
# ffmpeg is on PATH in CI and dev).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
# Real render: pulls the burn inference stack + pipeline (heavy build).
render = ["senmei-ml/burn", "senmei-core/render"]
# Runtime-libtorch (dlopen) engine: CUDA/ROCm libtorch is downloaded on demand
# into the data dir; Auto then prefers LibTorch when a GPU is present.
tch = ["senmei-ml/tch", "senmei-core/tch"]
# Full web UI + REST API (axum); embeds packages/app/dist via rust-embed.
http = ["dep:axum", "dep:tower-http", "dep:rust-embed"]
