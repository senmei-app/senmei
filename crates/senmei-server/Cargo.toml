[package]
name = "senmei-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Senmei service (MCP stdio first; HTTP behind a feature)."

[dependencies]
senmei-core = { path = "../senmei-core", version = "0.3.0" }
senmei-media = { path = "../senmei-media", version = "0.3.0" }
senmei-ml = { path = "../senmei-ml", version = "0.3.0" }

rmcp = { version = "3", features = ["server", "transport-io"] }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }
tower = { version = "0.5", features = ["util"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
clap.workspace = true
schemars.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", optional = true }
futures-core = { version = "0.3", optional = true }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

[dev-dependencies]
# Router smoke tests (oneshot + body collect); no GPU / no network (system
# ffmpeg is on PATH in CI and dev).
http-body-util = "0.1"

[features]
default = []
# Real render: pulls the burn inference stack + pipeline (heavy build).
render = ["senmei-ml/burn", "senmei-core/render"]
# Runtime-libtorch (dlopen) engine: CUDA/ROCm libtorch is downloaded on demand
# into the data dir; Auto then prefers LibTorch when a GPU is present.
tch = ["senmei-ml/tch", "senmei-core/tch"]
# Full web UI + REST API (axum); embeds packages/app/dist via rust-embed.
http = ["dep:axum", "dep:tower-http", "dep:rust-embed", "dep:tokio-stream", "dep:futures-core"]
