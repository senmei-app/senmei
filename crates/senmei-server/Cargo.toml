[package]
name = "senmei-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Senmei service (MCP stdio first; HTTP behind a feature)."

[dependencies]
senmei-media = { path = "../senmei-media", version = "0.1.2" }
senmei-ml = { path = "../senmei-ml", version = "0.1.2" }

rmcp = { version = "3", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
