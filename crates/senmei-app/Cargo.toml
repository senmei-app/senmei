[package]
name = "senmei-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri application shell for Senmei: commands, state, and IPC."

[dependencies]
# tar.xz like senmei-media: reuse the liblzma already in the graph (a zip dep
# would pull xz2 and conflict on the native `lzma` link).
tar = "0.4"
liblzma = "0.4"
senmei-core = { path = "../senmei-core", version = "0.2.3" }
senmei-media = { path = "../senmei-media", version = "0.2.3" }
senmei-ml = { path = "../senmei-ml", version = "0.2.3" }
senmei-pipeline = { path = "../senmei-pipeline", version = "0.2.3" }
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac"] }
base64.workspace = true
sysinfo = { version = "0.39", features = ["system"] }
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }

[features]
default = ["burn"]
# Vulkan (burn-wgpu) inference + the shared render core.
burn = ["senmei-ml/burn", "senmei-core/render"]
# Runtime-libtorch (dlopen) engine; implies burn for the Auto fallback.
tch = ["senmei-ml/tch", "senmei-core/tch", "senmei-core/render"]
