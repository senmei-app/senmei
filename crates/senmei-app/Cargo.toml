[package]
name = "senmei-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri application shell for Senmei: commands, state, and IPC."

[dependencies]
base64 = "0.22"
senmei-media = { path = "../senmei-media", version = "0.1.0" }
senmei-ml = { path = "../senmei-ml", version = "0.1.0", features = ["burn"] }
senmei-pipeline = { path = "../senmei-pipeline", version = "0.1.0" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
