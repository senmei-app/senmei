[package]
name = "senmei-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Render orchestration for Senmei: queue, events, and progress."

[dependencies]
log.workspace = true
senmei-media = { path = "../senmei-media", version = "0.2.4" }
senmei-ml = { path = "../senmei-ml", version = "0.2.4" }
thiserror.workspace = true

[features]
# Optional libtorch engine for `BENCH_BACKEND=tch`; never default — torch-sys
# needs a libtorch download with no arm64 macOS wheel, so the workspace test
# build must stay tch-free.
tch = ["senmei-ml/tch"]

[dev-dependencies]
# Burn feature only for the integration tests (real-model upscale).
senmei-ml = { path = "../senmei-ml", version = "0.2.4", features = ["burn"] }
