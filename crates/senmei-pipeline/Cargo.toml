[package]
name = "senmei-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Render orchestration for Senmei: queue, events, and progress."

[dependencies]
log = "0.4"
senmei-media = { path = "../senmei-media", version = "0.1.2" }
senmei-ml = { path = "../senmei-ml", version = "0.1.2" }
thiserror = "2"

[dev-dependencies]
# Burn feature only for the integration tests (real-model upscale).
senmei-ml = { path = "../senmei-ml", version = "0.1.2", features = ["burn"] }
