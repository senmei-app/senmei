[package]
name = "senmei-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic Senmei core: probe/render/models/queue + license/confirm gates."

[dependencies]
senmei-media = { path = "../senmei-media", version = "0.3.1" }
senmei-ml = { path = "../senmei-ml", version = "0.3.1" }
senmei-pipeline = { path = "../senmei-pipeline", version = "0.3.1", optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
log.workspace = true
specta = "2.0.0-rc.25"
base64.workspace = true
dirs.workspace = true

[features]
default = []
# Real render: pulls the burn inference stack + pipeline (heavy build).
render = ["dep:senmei-pipeline", "senmei-ml/burn"]
# Runtime-libtorch (dlopen) engine: CUDA/ROCm libtorch is downloaded on demand
# into the data dir; Auto then prefers LibTorch when a GPU is present.
tch = ["senmei-ml/tch"]
