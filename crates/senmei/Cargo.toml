[package]
name = "senmei"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Senmei (鮮明) — desktop video enhancer in Rust: frame interpolation and AI upscaling."
default-run = "senmei"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
senmei-app = { path = "../senmei-app", version = "0.1.2" }
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[features]
default = ["burn"]
burn = ["senmei-app/burn"]
tch = ["senmei-app/tch"]
