[package]
name = "senmei"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Senmei (鮮明) — desktop video enhancer in Rust: frame interpolation and AI upscaling."
default-run = "senmei"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
senmei-app = { path = "../senmei-app", version = "0.2.1" }
senmei-server = { path = "../senmei-server", version = "0.2.1", features = ["http"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[features]
default = ["burn"]
burn = ["senmei-app/burn", "senmei-server/render"]
tch = ["senmei-app/tch", "senmei-server/tch"]
