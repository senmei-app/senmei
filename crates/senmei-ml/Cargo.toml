[package]
name = "senmei-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Inference for Senmei: engine trait, ncnn engine, and model registry."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
senmei-ncnn = { path = "../senmei-ncnn" }
specta = { version = "2.0.0-rc.25", features = ["serde_json", "derive"] }
thiserror = "2"
