[package]
name = "senmei-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Inference for Senmei: engine trait, burn engine, and model registry."

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta = { version = "2.0.0-rc.25", features = ["serde_json", "derive"] }
thiserror.workspace = true
log.workspace = true

# Runtime hardware probing (dlopen CUDA/ROCm detection, like Koharu).
libloading = "0.9"

# Reuse the download/verify/extract helpers for runtime libtorch fetching.
senmei-media = { path = "../senmei-media", version = "0.2.4" }

# libtorch zip extraction.
zip.workspace = true

# burn inference (Vulkan fp16; Metal on macOS) behind the `burn` feature.
burn = { version = "=0.21.0", optional = true }
burn-store = { version = "=0.21.0", optional = true }

# Optional libtorch backend (burn-tch) for high-performance local runs.
burn-tch = { version = "=0.21.0", optional = true }
# Direct tch access (device probing, e.g. Cuda::is_available). Same pin as
# burn-tch 0.21; libtorch itself is resolved at runtime (CUDA/ROCm, see
# `crate::runtime`), so no build-time `download-libtorch`.
tch = { version = "0.22.0", optional = true }
# Direct FFI access to the dlopen loader (`torch_sys::loader`). Same fork as
# the one tch pulls in via [patch.crates-io].
torch-sys = { version = "0.22.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
burn-wgpu = { version = "=0.21.0", features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn-wgpu = { version = "=0.21.0", features = ["vulkan"], optional = true }

[features]
default = []
burn = ["dep:burn", "dep:burn-store", "dep:burn-wgpu"]
# libtorch backend for high-performance local runs; shares the `arch` modules
# and the `burn` tensor core, so it also enables the `burn` dependency (no wgpu).
tch = ["dep:burn-tch", "dep:burn", "dep:burn-store", "dep:tch", "dep:torch-sys"]

[[bin]]
name = "senmei-ml-convert"
path = "src/bin/convert.rs"
required-features = ["burn"]
