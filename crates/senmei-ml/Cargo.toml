[package]
name = "senmei-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Inference for Senmei: engine trait, torch/ncnn engines, and model registry."

[features]
default = []
torch = ["dep:tch"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["serde_json", "derive"] }
tch = { version = "0.16", optional = true }
