# cargo-deny license/bans/advisories gate. Run: `cargo-deny check`.
# Shipped product targets only — UEFI-only transitives (e.g. `r-efi` via
# `getrandom`) are excluded here, so the gate reflects what the app actually
# builds. (r-efi is tri-licensed MIT OR Apache-2.0 OR LGPL-2.1-or-later, so
# even un-excluded it is permissively choosable.) License policy per AGENTS.md:
# MIT OR Apache-2.0 for our code; permissive deps allowed
# (BSD/ISC/MPL/CC0/CDLA-Permissive/…).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",          # libbz2-rs-sys, via bzip2 (senmei-media)
    "CC0-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots 0.26/1.0, via ureq → senmei-media
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# No GPL/AGPL/LGPL in the built graph (r-efi/LGPL is UEFI-only, target-excluded).

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# `unmaintained` advisories only — no CVEs, all unavoidable transitives
# (recheck on next Tauri/burn update):
ignore = [
    # gtk-rs GTK3 bindings (gdk*/gtk* via tao/wry/webkit2gtk — the platform
    # webview required by the "no CEF" binding decision):
    "RUSTSEC-2024-0411", "RUSTSEC-2024-0412", "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414", "RUSTSEC-2024-0415", "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417", "RUSTSEC-2024-0418", "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # paste / proc-macro-error — proc-macro helpers (build-time):
    "RUSTSEC-2024-0436", "RUSTSEC-2024-0370",
    # unic-* — unicode normalization via idna/url (web/network stack):
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098", "RUSTSEC-2025-0100",
    # bincode — burn-core model serialization (upstream dep):
    "RUSTSEC-2025-0141",
]
