[workspace]
resolver = "2"
members = [
    "crates/senmei",
    "crates/senmei-app",
    "crates/senmei-pipeline",
    "crates/senmei-ml",
    "crates/senmei-media",
    "crates/senmei-server",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/senmei-app/senmei"

# Patched upstream crates under the senmei-app org (never vendored in-repo).
[patch.crates-io]
# Windows DX12 build: wgpu-hal 29 needs windows 0.62; upstream 0.28.0 range
# unifies to 0.61 with tauri. Fork pins windows = 0.62 (see
# github.com/senmei-app/gpu-allocator).
gpu-allocator = { git = "https://github.com/senmei-app/gpu-allocator", tag = "v0.28.0-windows-0.62" }
# Optional libtorch (`tch`) engine: ROCm 2.15-nightly support (C++20 build,
# removed-ops mapping, ROCm rpath-link) + cuda_hack signature match. Proper
# forks of LaurentMazare/tch-rs and tracel-ai/burn; the `v*-senmei` tags have
# the crate at the repo root (subtree-split) so [patch] can point at them.
torch-sys = { git = "https://github.com/senmei-app/tch-rs", tag = "v0.22.0-senmei" }
burn-tch = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei" }
