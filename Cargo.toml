[workspace]
resolver = "2"
members = [
    "crates/senmei",
    "crates/senmei-app",
    "crates/senmei-core",
    "crates/senmei-pipeline",
    "crates/senmei-ml",
    "crates/senmei-media",
    "crates/senmei-server",
]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/senmei-app/senmei"

# Shared dependency versions — one place to maintain, crates use `X.workspace = true`.
[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
schemars = "1"
base64 = "0.22"

# Patched upstream crates under the senmei-app org (never vendored in-repo).
[patch.crates-io]
# Windows DX12 build: wgpu-hal 29 needs windows 0.62; upstream 0.28.0 range
# unifies to 0.61 with tauri. Fork pins windows = 0.62 (see
# github.com/senmei-app/gpu-allocator).
gpu-allocator = { git = "https://github.com/senmei-app/gpu-allocator", tag = "v0.28.0-windows-0.62" }
# Runtime libtorch via dlopen: torch-sys loads libtorch at runtime (no
# build-time link), so tch/burn-tch must not add libtorch link args. Tags:
#   tch-rs v0.22.0-senmei-win (dlopen loader for Linux/macOS/Windows; the
#   Windows wrapper is built with CMake+MSVC against downloaded libtorch),
#   burn v0.21.0-senmei-burn-store-strides (burn-tch dlopen + burn-store
#   stride-respecting PytorchReader, on the senmei-0.21.0 workspace base)
torch-sys = { git = "https://github.com/senmei-app/tch-rs", tag = "v0.22.0-senmei-win" }
tch = { git = "https://github.com/senmei-app/tch-rs", tag = "v0.22.0-senmei-win" }
# burn-tch/burn-store come from the senmei-0.21.0 workspace fork (dlopen +
# stride-respecting PytorchReader); the core burn crates are patched from the
# same tag so the fork's workspace deps unify instead of duplicating
# burn-core/burn-backend as separate git instances.
burn-tch = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei-burn-store-strides" }
burn-store = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei-burn-store-strides" }
burn-core = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei-burn-store-strides" }
burn-tensor = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei-burn-store-strides" }
burn-backend = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei-burn-store-strides" }
burn-std = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei-burn-store-strides" }
burn-derive = { git = "https://github.com/senmei-app/burn", tag = "v0.21.0-senmei-burn-store-strides" }
