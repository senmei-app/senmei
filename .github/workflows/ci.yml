name: CI

on:
  # PRs, release tags, manual; not push-to-main (too frequent).
  pull_request:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Install ffmpeg (macOS tests)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Ensure ffmpeg (Windows tests)
        if: runner.os == 'Windows'
        shell: pwsh
        run: where.exe ffmpeg || (choco install ffmpeg -y)

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: node_modules
          cache-dependency-path: ./bun.lock

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Frontend typecheck + build
        run: bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        run: cargo check --workspace

      # GPU tests are #[ignore] (need Vulkan + downloaded models), so this
      # runs the CPU/unit tests everywhere; on macOS there is no Metal path
      # exercised on hosted runners either.
      - name: cargo test --workspace
        run: cargo test --workspace

      # senmei_app test exe died with 0xc0000139 at load; dump its import table
      # and retry with a system-only PATH to isolate the culprit DLL.
      - name: Diagnose test exe load failure (Windows)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\debug\deps\senmei_app-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem target\debug\deps\*.exe | Select-Object -First 1 }
          Write-Host "EXE: $($exe.FullName) ($([Math]::Round($exe.Length/1MB,1)) MB)"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
            if ($vs) {
              $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dumpbin) { Write-Host "DUMPBIN: $($dumpbin.FullName)"; & $dumpbin.FullName /dependents $exe.FullName } else { Write-Host 'dumpbin not found under vswhere path' }
            } else { Write-Host 'vswhere found no VS' }
          } else { Write-Host 'vswhere not found' }

          Write-Host '--- PATH entries ---'
          $env:PATH -split ';' | Where-Object { $_ }

          Write-Host '--- retry with system-only PATH ---'
          $sys = @('C:\Windows\System32','C:\Windows','C:\Windows\System32\Wbem','C:\Windows\System32\WindowsPowerShell\v1.0', (Split-Path $exe.FullName))
          $env:PATH = $sys -join ';'
          & $exe.FullName --list
          Write-Host "retry LASTEXITCODE: $LASTEXITCODE"

      # Debug artifacts from check+test + the release build exceed the runner
      # disk; drop the debug profile before the release bundle build.
      - name: Free disk for release build
        shell: bash
        run: rm -rf target/debug

      - name: Build app bundle
        run: bunx @tauri-apps/cli@^2 build

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: senmei-${{ matrix.os }}
          path: target/release/bundle/**/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          path: bundles
          pattern: senmei-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
