name: CI

on:
  # PRs, release tags, manual; not push-to-main (too frequent).
  pull_request:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Install ffmpeg (macOS tests)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Ensure ffmpeg (Windows tests)
        if: runner.os == 'Windows'
        shell: pwsh
        run: where.exe ffmpeg || (choco install ffmpeg -y)

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Frontend typecheck + build
        run: bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        run: cargo check --workspace

      # GPU tests are #[ignore] (need Vulkan + downloaded models), so this
      # runs the CPU/unit tests everywhere; on macOS there is no Metal path
      # exercised on hosted runners either.
      - name: cargo test --workspace
        run: cargo test --workspace

      # senmei_app test exe died with 0xc0000139 at load; dump its imports and
      # retry with the choco-ffmpeg dirs scrubbed from PATH to find the culprit.
      - name: Diagnose test exe load failure (Windows)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\debug\deps\senmei_app-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem target\debug\deps\*.exe | Select-Object -First 1 }
          Write-Host "EXE: $($exe.FullName)"
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents $exe.FullName } else { Write-Host 'dumpbin not found' }
          Write-Host '--- choco ffmpeg dlls ---'
          Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -Filter *.dll -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $scrub = ($env:PATH -split ';') | Where-Object { $_ -notmatch 'chocolatey' }
          $env:PATH = $scrub -join ';'
          Write-Host '--- retry with scrubbed PATH ---'
          & $exe.FullName --list

      # Debug artifacts from check+test + the release build exceed the runner
      # disk; drop the debug profile before the release bundle build.
      - name: Free disk for release build
        shell: bash
        run: rm -rf target/debug

      - name: Build app bundle
        run: bunx @tauri-apps/cli@^2 build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: senmei-${{ matrix.os }}
          path: target/release/bundle/**/*
          if-no-files-found: warn
