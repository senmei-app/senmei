name: CI

on:
  # PRs, release tags, manual; not push-to-main (too frequent).
  pull_request:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          # apt occasionally hangs on fresh ubuntu runners (lock/mirror);
          # retry the update and bound the lock/network waits.
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=120 \
            -o Acquire::https::Timeout=120
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o DPkg::Lock::Timeout=300 \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Install ffmpeg (macOS tests)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Ensure ffmpeg (Windows tests)
        if: runner.os == 'Windows'
        shell: pwsh
        run: where.exe ffmpeg || (choco install ffmpeg -y)

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: node_modules
          cache-dependency-path: ./bun.lock

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Frontend typecheck + build
        run: bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        run: cargo check --workspace

      # GPU tests are #[ignore] (need Vulkan + downloaded models), so this
      # runs the CPU/unit tests everywhere; on macOS there is no Metal path
      # exercised on hosted runners either.
      # Windows: the senmei-app lib test exe cannot load in a bare harness
      # (no app manifest -> comctl32 v5 -> missing v6 exports); its tests run
      # on Linux/macOS instead.
      - name: cargo test --workspace
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --workspace --exclude senmei-app
          else
            cargo test --workspace
          fi2 v5 -> missing v6 exports); its tests run
      # on Linux/macOS instead.
      - name: cargo test --workspace
        run: cargo test --workspace

      # senmei_app test exe died with 0xc0000139 at load; dump imports at the
      # function level and compare with the working senmei bin exe.
      - name: Diagnose test exe load failure (Windows)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\debug\deps\senmei_app-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem target\debug\deps\*.exe | Select-Object -First 1 }
          $bin = Get-ChildItem target\debug\deps\senmei-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "EXE: $($exe.FullName) ($([Math]::Round($exe.Length/1MB,1)) MB)"
          Write-Host "BIN: $($bin.FullName) ($([Math]::Round($bin.Length/1MB,1)) MB)"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
            if ($vs) { $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          }
          if (-not $dumpbin) { $dumpbin = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($dumpbin) {
            Write-Host "DUMPBIN: $($dumpbin.FullName)"
            Write-Host '--- FAILING exe dependents ---'
            & $dumpbin.FullName /dependents $exe.FullName
            if ($bin) {
              Write-Host '--- WORKING bin dependents ---'
              & $dumpbin.FullName /dependents $bin.FullName
            }
            Write-Host '--- FAILING exe imports ---'
            & $dumpbin.FullName /imports $exe.FullName
          } else { Write-Host 'dumpbin not found' }

          Write-Host '--- suspect DLL versions ---'
          foreach ($d in 'C:\Windows\System32\opengl32.dll','C:\Windows\System32\VCRUNTIME140.dll','C:\Windows\System32\msvcp140.dll','C:\Windows\System32\setupapi.dll','C:\Windows\System32\comctl32.dll') {
            if (Test-Path $d) { $v = (Get-Item $d).VersionInfo; Write-Host "$d : $($v.FileVersion) $($v.ProductVersion)" } else { Write-Host "$d : MISSING" }
          }

          Write-Host '--- retry with system-only PATH ---'
          $sys = @('C:\Windows\System32','C:\Windows','C:\Windows\System32\Wbem','C:\Windows\System32\WindowsPowerShell\v1.0', (Split-Path $exe.FullName))
          $env:PATH = $sys -join ';'
          & $exe.FullName --list
          Write-Host "retry LASTEXITCODE: $LASTEXITCODE"

          Write-Host '--- application event log (entry point errors) ---'
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'entry point|0xc0000139' } |
            ForEach-Object { Write-Host $_.Message }

      # Debug artifacts from check+test + the release build exceed the runner
      # disk; drop the debug profile before the release bundle build.
      - name: Free disk for release build
        shell: bash
        run: rm -rf target/debug

      - name: Build app bundle
        run: bunx @tauri-apps/cli@^2 build

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: senmei-${{ matrix.os }}
          path: target/release/bundle/**/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          path: bundles
          pattern: senmei-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
